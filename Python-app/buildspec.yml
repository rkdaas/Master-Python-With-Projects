version: 0.2

phases:
  install:
    commands:
      - echo "updating packages"
      - yum update -y
      - echo "Installing python"
      - yum install -y python3 python3-pip
      - python3 --version

  build:
    commands:
      - echo "Running python script for verification"
      - python3 src/hello.py

artifacts:
  files:
    - appspec.yml
    - scripts/**/*
    - scripts/**/*

  discard-paths: no
